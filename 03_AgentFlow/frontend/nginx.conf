# Serves the built AgentFlow SPA. All unknown paths fall back to index.html
# so React Router's client-side routes (e.g. /console) work on a hard
# refresh instead of returning nginx's own 404.
#
# Author: Mahesh Kumar
# Founder & CEO, SaffronyxAI.in
# Copyright: © 2026 SaffronyxAI.in. All Rights Reserved.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
